name: Build IPA for TrollStore

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK version'
        required: false
        default: '3.29.0'

env:
  APP_NAME: XSOPForum
  BUNDLE_ID: com.xsop.forum

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 1. 设置 Flutter ==========
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: ${{ github.event.inputs.flutter_version || '3.29.0' }}
          cache: true

      - name: Verify Flutter
        run: flutter config --no-analytics && flutter doctor -v

      # ========== 2. 保存自定义 lib/ 代码 ==========
      - name: Backup lib
        run: |
          # 保存原始 lib/ 代码，防止 flutter create 覆盖
          tar cf lib_backup.tar lib/
          echo "lib/ backed up"
          ls -la lib/

      # ========== 3. 生成 iOS 平台文件（全新生成，避免冲突）==========
      - name: Generate iOS platform
        run: |
          # 先删除旧的 ios/ 目录，确保 flutter create 生成干净的工程
          rm -rf ios/
          echo "Old ios/ directory removed"

          flutter create . --platforms=ios --project-name=xsop_forum 2>&1

          # 恢复自定义 lib/ 代码
          rm -rf lib/
          tar xf lib_backup.tar
          echo "lib/ restored"

          # 验证 main.dart 是否包含自定义代码
          if grep -q "XSOPForumApp" lib/main.dart; then
            echo "✅ main.dart contains custom code"
          else
            echo "❌ main.dart was overwritten by flutter create!"
            cat lib/main.dart
            exit 1
          fi

          flutter pub get

      # ========== 4. 安装 CocoaPods 依赖 ==========
      - name: Install pods
        working-directory: ios
        run: |
          rm -rf Pods Podfile.lock
          pod install 2>&1 | tail -20

      # ========== 5. 写入 TrollStore 扩展权限 ==========
      - name: Write Runner.entitlements
        run: |
          cat > ios/Runner/Runner.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.ubiquity-kvstore-access</key>
              <true/>
              <key>com.apple.developer.kernel.extended-virtual-address-space</key>
              <true/>
              <key>com.apple.security.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.developer.playable-content</key>
              <true/>
              <key>com.apple.developer.networking.wifi-info</key>
              <true/>
              <key>com.apple.developer.usb.host-device</key>
              <true/>
              <key>com.apple.developer.avfoundation.audio-fetch</key>
              <true/>
              <key>com.apple.security.files.user-selected.read-only</key>
              <true/>
              <key>com.apple.security.files.user-selected.read-write</key>
              <true/>
          </dict>
          </plist>
          PLIST

      # ========== 6. 写入 Info.plist ==========
      - name: Write Info.plist
        run: |
          cat > ios/Runner/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleDisplayName</key>
              <string>XSOP 论坛</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictorVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$(FLUTTER_BUILD_NAME)</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>$(FLUTTER_BUILD_NUMBER)</string>
              <key>IPHONEOS_DEPLOYMENT_TARGET</key>
              <string>15.0</string>
              <key>UIStatusBarStyle</key>
              <string>UIStatusBarStyleDefault</string>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>需要访问相册以上传头像</string>
              <key>NSCameraUsageDescription</key>
              <string>需要使用相机拍照上传</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>需要使用麦克风录制语音</string>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>需要获取位置信息</string>
              <key>NSLocationAlwaysUsageDescription</key>
              <string>需要后台持续获取位置</string>
              <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
              <string>需要持续获取位置信息</string>
              <key>NSBluetoothAlwaysUsageDescription</key>
              <string>需要蓝牙权限</string>
              <key>NSBluetoothPeripheralUsageDescription</key>
              <string>需要蓝牙外设权限</string>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
                  <string>fetch</string>
                  <string>remote-notification</string>
                  <string>processing</string>
                  <string>location</string>
              </array>
              <key>UIFileSharingEnabled</key>
              <false/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <false/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIRequiresFullScreen</key>
              <false/>
          </dict>
          </plist>
          PLIST

      # ========== 7. 修改 Bundle ID + 禁用代码签名 ==========
      - name: Set Bundle ID and disable signing
        run: |
          # 修改 Bundle ID
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = com.xsop.forum;/g' ios/Runner.xcodeproj/project.pbxproj

          # 禁用代码签名（TrollStore 自行签名）
          # 替换所有 CODE_SIGNING_ALLOWED = YES 为 NO
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [^"]*;/DEVELOPMENT_TEAM = "";/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^"]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = [^"]*;/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj

          echo "✅ Bundle ID set and code signing disabled"

          # 验证关键配置
          echo "=== Verifying signing settings ==="
          grep "CODE_SIGNING_ALLOWED" ios/Runner.xcodeproj/project.pbxproj | head -3
          grep "DEVELOPMENT_TEAM" ios/Runner.xcodeproj/project.pbxproj | head -3

      # ========== 8. 主构建：flutter build ipa（官方推荐）+ fallback ==========
      - name: Build IPA with Flutter
        run: |
          # flutter build ipa 在 Flutter 3.29 中不支持 --output
          # 默认输出到 build/ios/ipa/
          # --no-codesign 跳过签名（需配合 pbxproj 中的 CODE_SIGNING_ALLOWED=NO）
          flutter build ipa \
            --no-codesign \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=BASE_URL=https://xsop.de 2>&1 | tee /tmp/flutter_build.log
          FLUTTER_EXIT=${PIPESTATUS[0]}

          if [ "$FLUTTER_EXIT" -ne 0 ]; then
            echo "============================================"
            echo "  flutter build ipa FAILED - trying flutter build ios"
            echo "============================================"
            tail -30 /tmp/flutter_build.log

            # Fallback: flutter build ios 生成 .app，手动打包
            flutter build ios \
              --no-codesign \
              --obfuscate \
              --split-debug-info=build/debug-info \
              --dart-define=BASE_URL=https://xsop.de 2>&1 | tee /tmp/flutter_build_ios.log
            IOS_EXIT=${PIPESTATUS[0]}

            if [ "$IOS_EXIT" -ne 0 ]; then
              echo "============================================"
              echo "  flutter build ios ALSO FAILED"
              echo "============================================"
              tail -80 /tmp/flutter_build_ios.log
              exit 1
            fi

            echo "============================================"
            echo "  flutter build ios SUCCESS - packaging manually"
            echo "============================================"

            # 查找 .app 文件
            APP_PATH=$(find build -name "*.app" -not -path "*/.symlinks/*" -type d 2>/dev/null | head -1)
            if [ -z "$APP_PATH" ]; then
              echo "ERROR: .app not found after flutter build ios!"
              find . -name "*.app" -type d 2>/dev/null | head -5
              exit 1
            fi

            echo "Found .app: $APP_PATH"

            # 手动打包 IPA
            OUTPUT_DIR="${GITHUB_WORKSPACE}/build/ipa_output"
            mkdir -p "$OUTPUT_DIR"
            APP_NAME=$(basename "$APP_PATH" .app)

            STAGING="${GITHUB_WORKSPACE}/build/staging"
            rm -rf "$STAGING"
            mkdir -p "$STAGING/Payload"
            cp -r "$APP_PATH" "$STAGING/Payload/"

            cd "$STAGING"
            zip -r "${APP_NAME}_TrollStore.ipa" Payload/
            cd "${GITHUB_WORKSPACE}"

            IPA_FILE="$OUTPUT_DIR/${APP_NAME}_TrollStore.ipa"
            cp "$STAGING/${APP_NAME}_TrollStore.ipa" "$IPA_FILE"

            echo "✅ Manual IPA created: $IPA_FILE"
          else
            echo "============================================"
            echo "  flutter build ipa SUCCESS"
            echo "============================================"

            # flutter build ipa 默认输出到 build/ios/ipa/
            echo "=== Looking for IPA in build/ios/ipa/ ==="
            ls -la build/ios/ipa/ 2>/dev/null || echo "Directory not found"

            # 查找所有 IPA 文件
            echo "=== Searching all IPA files ==="
            find . -name "*.ipa" 2>/dev/null

            # 检查文件大小
            IPA_FILE=$(find . -name "*.ipa" -not -path "*/.symlinks/*" 2>/dev/null | head -1)
            if [ -z "$IPA_FILE" ]; then
              echo "ERROR: No IPA file found!"
              exit 1
            fi

            # 复制到 ipa_output 目录
            OUTPUT_DIR="${GITHUB_WORKSPACE}/build/ipa_output"
            mkdir -p "$OUTPUT_DIR"
            cp "$IPA_FILE" "$OUTPUT_DIR/"
            IPA_FILE="$OUTPUT_DIR/$(basename $IPA_FILE)"
            echo "IPA copied to $OUTPUT_DIR"
          fi

          # 验证 IPA
          IPA_SIZE=$(stat -f%z "$IPA_FILE" 2>/dev/null || stat --format=%s "$IPA_FILE" 2>/dev/null || echo "0")
          echo "IPA file: $IPA_FILE"
          echo "IPA size: $IPA_SIZE bytes"

          if [ "$IPA_SIZE" -lt 15728640 ]; then
            echo "ERROR: IPA is too small (${IPA_SIZE} bytes). A real Flutter app should be > 15MB."
            echo "This indicates the build produced an empty shell."
            echo ""
            echo "=== Debug: checking .app structure ==="
            find . -name "*.app" -type d 2>/dev/null | while read app; do
              echo "App: $app"
              echo "  Size: $(du -sh "$app" 2>/dev/null | cut -f1)"
              ls -la "$app/Frameworks/" 2>/dev/null | head -5
            done
            exit 1
          fi

          echo "✅ IPA size is valid (>15MB)"
          ls -la "$OUTPUT_DIR/"

      # ========== 9. 注入 TrollStore Entitlements ==========
      # flutter build ipa 不会自动将 .entitlements 文件打入 .app 包
      # 这里手动解压 IPA → 注入 entitlements → 重新打包
      - name: Inject Entitlements into IPA
        run: |
          OUTPUT_DIR="${GITHUB_WORKSPACE}/build/ipa_output"
          IPA_FILE=$(ls "$OUTPUT_DIR"/*.ipa 2>/dev/null | head -1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No IPA found in $OUTPUT_DIR"
            exit 1
          fi

          echo "Injecting entitlements into: $IPA_FILE"

          # 创建临时目录
          ENT_DIR="${GITHUB_WORKSPACE}/build/entitlements_work"
          rm -rf "$ENT_DIR"
          mkdir -p "$ENT_DIR"

          # 解压 IPA (IPA 本质是 zip)
          cd "$ENT_DIR"
          unzip -o "$IPA_FILE" -d . > /dev/null 2>&1

          # 找到 .app 目录
          APP_PATH=$(find . -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in IPA!"
            ls -la
            exit 1
          fi

          echo "App path in IPA: $APP_PATH"

          # 将 entitlements 文件复制到 .app 目录
          # TrollStore 会自动查找 .app 内的 .entitlements 文件
          cp "${GITHUB_WORKSPACE}/ios/Runner/Runner.entitlements" "$APP_PATH/"

          # 同时创建一个与 App 同名的 entitlements 文件（TrollStore 也会查找）
          APP_NAME=$(basename "$APP_PATH" .app)
          cp "${GITHUB_WORKSPACE}/ios/Runner/Runner.entitlements" "$APP_PATH/${APP_NAME}.entitlements"

          echo "Entitlements injected:"
          ls -la "$APP_PATH/"*.entitlements 2>/dev/null

          # 重新打包 IPA
          rm -f "$IPA_FILE"
          zip -r "$IPA_FILE" . -x "*.DS_Store"

          # 验证
          IPA_SIZE=$(stat -f%z "$IPA_FILE" 2>/dev/null || stat --format=%s "$IPA_FILE" 2>/dev/null || echo "0")
          echo "Repackaged IPA size: $IPA_SIZE bytes"

          if [ "$IPA_SIZE" -lt 15728640 ]; then
            echo "ERROR: Repackaged IPA is too small!"
            exit 1
          fi

          cd "${GITHUB_WORKSPACE}"
          echo "✅ Entitlements injected successfully"

      # ========== 10. 上传到 Artifacts ==========
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-IPA
          path: build/ipa_output/*.ipa
          retention-days: 90

      # ========== 11. 上传到 GitHub Releases（打 Tag 时）==========
      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          files: build/ipa_output/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========== 12. 为手动触发创建 Draft Release ==========
      - name: Create Draft Release for Manual Trigger
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Draft Build ${{ github.run_number }}
          tag_name: v0.0.${{ github.run_number }}
          files: build/ipa_output/*.ipa
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
