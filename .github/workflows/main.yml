name: Build IPA for TrollStore

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      node_version: 
        description: 'Node.js version'
        required: false
        default: '24' # [修改位置]：将原先的 '20' 修改为 '24'。 [修改备注]：为了适配 GitHub Actions 最新运行环境的要求，消除 Node.js 20 弃用的警告。

env:
  APP_NAME: XSOPForum
  BUNDLE_ID: com.xsop.forum

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 1. 设置构建环境 ==========
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ github.event.inputs.node_version || '24' }} # [修改位置]：原先的 '20' 改为 '24'。
          # [修改位置]：删除了原先这里的 `cache: 'npm'`。 
          # [修改备注]：由于你的项目中没有提交 package-lock.json 或 yarn.lock 文件，强制开启缓存会导致寻径失败报错。移除此行后即可顺利往下安装依赖。

      # ========== 2. 生成 iOS 平台文件 ==========
      - name: Install dependencies & Prebuild
        run: |
          npm install
          npx expo prebuild --platform ios --clean

      # ========== 3. 安装 CocoaPods ==========
      - name: Install pods
        working-directory: ios
        run: |
          pod install 2>&1
          echo "=== Pod install done ==="

      # ========== 4. 写入 TrollStore 权限 ==========
      - name: Write Entitlements
        run: |
          ENTITLEMENTS_PATH=$(find ios -name "*.entitlements" | head -n 1)
          if [ -n "$ENTITLEMENTS_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.ubiquity-kvstore-access bool true" "$ENTITLEMENTS_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.extended-virtual-address-space bool true" "$ENTITLEMENTS_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.allow-unsigned-executable-memory bool true" "$ENTITLEMENTS_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.playable-content bool true" "$ENTITLEMENTS_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.files.user-selected.read-only bool true" "$ENTITLEMENTS_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.files.user-selected.read-write bool true" "$ENTITLEMENTS_PATH" || true
            echo "Entitlements injected to $ENTITLEMENTS_PATH"
          fi

      # ========== 5. 修改 Bundle ID ==========
      - name: Set Bundle ID
        run: |
          PBXPROJ_PATH=$(find ios -name "project.pbxproj" | head -n 1)
          if [ -n "$PBXPROJ_PATH" ]; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^\;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }};/g" "$PBXPROJ_PATH"
            echo "Bundle ID set to ${{ env.BUNDLE_ID }}"
          fi

      # ========== 6. 使用 xcodebuild 构建 ==========
      - name: Build App (No Codesign)
        working-directory: ios
        run: |
          WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | xcpretty || true

      # ========== 7. 打包为 TrollStore IPA ==========
      - name: Package to IPA
        run: |
          IPA_OUT="${GITHUB_WORKSPACE}/build/ipa_output"
          mkdir -p "$IPA_OUT/Payload"
          
          # 查找 xcodebuild 生成的 .app 文件夹
          APP_PATH=$(find ios/build_output/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" "$IPA_OUT/Payload/"
            cd "$IPA_OUT"
            zip -r "${{ env.APP_NAME }}.ipa" Payload
            rm -rf Payload
            echo "=== IPA Packaged SUCCESS ==="
            ls -la
          else
            echo "ERROR: No .app found in build output!"
            exit 1
          fi

      # ========== 8. 上传到 Artifacts ==========
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-IPA
          path: build/ipa_output/*.ipa
          retention-days: 90

      # ========== 9. 上传到 GitHub Releases ==========
      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          files: build/ipa_output/*.ipa
          draft: false
          prerelease: false
          body: |
            ## XSOP-Forum TrollStore 更新发布
            
            **专业与商业介绍：**
            我们致力于提供稳定、高效的平台系统，注重内容的呈现与社群交流体验。请注意，本平台不提供任何算法服务。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========== 10. 为手动触发创建 Draft Release ==========
      - name: Create Draft Release for Manual Trigger
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Draft Build ${{ github.run_number }}
          tag_name: v0.0.${{ github.run_number }}
          files: build/ipa_output/*.ipa
          draft: true
          prerelease: true
          body: |
            ## XSOP-Forum TrollStore 草稿构建 (Draft)
            
            **专业与商业介绍：**
            我们致力于提供稳定、高效的平台系统，注重内容的呈现与社群交流体验。请注意，本平台不提供任何算法服务。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
