name: Build IPA for TrollStore

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK version'
        required: false
        default: '3.29.0'

env:
  APP_NAME: XSOPForum
  BUNDLE_ID: com.xsop.forum

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 1. 设置 Flutter ==========
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: ${{ github.event.inputs.flutter_version || '3.29.0' }}
          cache: true

      - name: Verify Flutter
        run: flutter config --no-analytics && flutter doctor -v

      # ========== 2. 备份 lib/ 和 pubspec.yaml ==========
      - name: Backup source code
        run: |
          tar cf src_backup.tar lib/ pubspec.yaml
          echo "Source backed up"
          ls -la lib/

      # ========== 3. 生成 iOS 平台 + 恢复源码 ==========
      - name: Generate iOS and restore source
        run: |
          rm -rf ios/
          flutter create . --platforms=ios --project-name=xsop_forum 2>&1

          # 恢复自定义代码
          rm -rf lib/ pubspec.yaml
          tar xf src_backup.tar

          # 验证
          if grep -q "XSOPForumApp" lib/main.dart; then
            echo "✅ main.dart verified"
          else
            echo "❌ main.dart was overwritten!"
            cat lib/main.dart
            exit 1
          fi

          flutter pub get

      # ========== 4. 安装 CocoaPods ==========
      - name: Install pods
        working-directory: ios
        run: |
          rm -rf Pods Podfile.lock
          pod install 2>&1 | tail -30

      # ========== 5. 写入 Info.plist ==========
      - name: Write Info.plist
        run: |
          cat > ios/Runner/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleDisplayName</key>
              <string>XSOP 论坛</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictorVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$(FLUTTER_BUILD_NAME)</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>$(FLUTTER_BUILD_NUMBER)</string>
              <key>IPHONEOS_DEPLOYMENT_TARGET</key>
              <string>15.0</string>
              <key>UIStatusBarStyle</key>
              <string>UIStatusBarStyleDefault</string>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>需要访问相册以上传头像</string>
              <key>NSCameraUsageDescription</key>
              <string>需要使用相机拍照上传</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>需要使用麦克风录制语音</string>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>需要获取位置信息</string>
              <key>NSLocationAlwaysUsageDescription</key>
              <string>需要后台持续获取位置</string>
              <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
              <string>需要持续获取位置信息</string>
              <key>NSBluetoothAlwaysUsageDescription</key>
              <string>需要蓝牙权限</string>
              <key>NSBluetoothPeripheralUsageDescription</key>
              <string>需要蓝牙外设权限</string>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
                  <string>fetch</string>
                  <string>remote-notification</string>
                  <string>processing</string>
                  <string>location</string>
              </array>
              <key>UIFileSharingEnabled</key>
              <false/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <false/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIRequiresFullScreen</key>
              <false/>
          </dict>
          </plist>
          PLIST

      # ========== 6. 修改 pbxproj：Bundle ID + 假 Team ID + 禁用签名 ==========
      - name: Configure Xcode project
        run: |
          PROJ="ios/Runner.xcodeproj/project.pbxproj"

          # Bundle ID
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = com.xsop.forum;/g' "$PROJ"

          # 设置假的 Team ID（Flutter 构建需要非空 Team ID，--no-codesign 不会真正签名）
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "ABCDE12345";/g' "$PROJ"

          # 禁用签名
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$PROJ"
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$PROJ"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' "$PROJ"
          sed -i '' 's/EXPANDED_CODE_SIGN_IDENTITY = [^;]*;/EXPANDED_CODE_SIGN_IDENTITY = "";/g' "$PROJ"
          sed -i '' 's/EXPANDED_CODE_SIGN_IDENTITY_PATH = [^;]*;/EXPANDED_CODE_SIGN_IDENTITY_PATH = "";/g' "$PROJ"
          sed -i '' 's/CODE_SIGN_STYLE = [^;]*;/CODE_SIGN_STYLE = Automatic;/g' "$PROJ"

          echo "✅ Project configured"
          echo "=== Verifying ==="
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$PROJ" | head -2
          grep "CODE_SIGNING_ALLOWED" "$PROJ" | head -2
          grep "DEVELOPMENT_TEAM" "$PROJ" | head -2

      # ========== 7. flutter build ios（编译 Dart + 生成 .app）==========
      # flutter build ios 会执行 flutter assemble（编译 Dart）+ xcodebuild
      # 假 Team ID 通过了 Flutter 的检查，--no-codesign 跳过真正的签名
      - name: Build .app with Flutter
        run: |
          DERIVED="${GITHUB_WORKSPACE}/build/DerivedData"

          cd ios
          rm -rf build/ "$DERIVED"

          # 使用 flutter build ios 编译（不打包 IPA）
          # --no-codesign 跳过签名
          # --no-debug 确保 Release 构建
          flutter build ios \
            --no-codesign \
            --no-debug \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=BASE_URL=https://xsop.de 2>&1 | tee /tmp/flutter_build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          cd "${GITHUB_WORKSPACE}"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "============================================"
            echo "  flutter build ios FAILED"
            echo "============================================"
            tail -100 /tmp/flutter_build.log
            exit 1
          fi

          echo "============================================"
          echo "  flutter build ios SUCCESS"
          echo "============================================"

          # 查找 .app
          echo "=== Searching for .app ==="
          APP_PATH=$(find "$DERIVED" -name "*.app" -not -path "*/.symlinks/*" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -not -path "*/.symlinks/*" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -name "*.app" -not -path "*/.symlinks/*" -type d 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app not found!"
            find . -name "*.app" -type d 2>/dev/null
            exit 1
          fi

          echo "Found .app: $APP_PATH"
          echo "App size: $(du -sh "$APP_PATH" 2>/dev/null | cut -f1)"

          # 验证 .app 结构（必须有 Frameworks 和可执行文件）
          if [ -d "$APP_PATH/Frameworks" ]; then
            echo "Frameworks: $(ls "$APP_PATH/Frameworks/" 2>/dev/null | wc -l) items"
          else
            echo "ERROR: No Frameworks directory! Flutter engine not linked."
            ls -la "$APP_PATH/"
            exit 1
          fi

          APP_BIN=$(basename "$APP_PATH" .app)
          if [ -f "$APP_PATH/$APP_BIN" ]; then
            echo "Executable: $APP_PATH/$APP_BIN ($(du -sh "$APP_PATH/$APP_BIN" 2>/dev/null | cut -f1))"
          else
            echo "ERROR: No executable at $APP_PATH/$APP_BIN"
            ls -la "$APP_PATH/"
            exit 1
          fi

          APP_SIZE=$(du -sh "$APP_PATH" 2>/dev/null | cut -f1)
          echo "✅ .app is valid ($APP_SIZE)"

      # ========== 8. 打包 IPA + 注入 Entitlements ==========
      - name: Package IPA with Entitlements
        run: |
          OUTPUT_DIR="${GITHUB_WORKSPACE}/build/ipa_output"
          DERIVED="${GITHUB_WORKSPACE}/build/DerivedData"

          # 重新定位 .app（跨 step 路径保持一致）
          APP_PATH=$(find "$DERIVED" -name "*.app" -not -path "*/.symlinks/*" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -not -path "*/.symlinks/*" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -name "*.app" -not -path "*/.symlinks/*" -type d 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in any location!"
            find . -name "*.app" -type d 2>/dev/null
            exit 1
          fi

          echo "Using .app: $APP_PATH"

          # 创建 entitlements 文件
          cat > ios/Runner/Runner.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.ubiquity-kvstore-access</key>
              <true/>
              <key>com.apple.developer.kernel.extended-virtual-address-space</key>
              <true/>
              <key>com.apple.security.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.developer.playable-content</key>
              <true/>
              <key>com.apple.developer.networking.wifi-info</key>
              <true/>
              <key>com.apple.developer.usb.host-device</key>
              <true/>
              <key>com.apple.developer.avfoundation.audio-fetch</key>
              <true/>
              <key>com.apple.security.files.user-selected.read-only</key>
              <true/>
              <key>com.apple.security.files.user-selected.read-write</key>
              <true/>
          </dict>
          </plist>
          PLIST

          # 将 entitlements 复制到 .app 内
          APP_NAME=$(basename "$APP_PATH" .app)
          cp ios/Runner/Runner.entitlements "$APP_PATH/"
          cp ios/Runner/Runner.entitlements "$APP_PATH/${APP_NAME}.entitlements"
          echo "Entitlements injected into .app"

          # 打包 IPA
          mkdir -p "$OUTPUT_DIR"
          STAGING="${GITHUB_WORKSPACE}/build/staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -r "$APP_PATH" "$STAGING/Payload/"

          cd "$STAGING"
          zip -r "${APP_NAME}_TrollStore.ipa" Payload/ -x "*.DS_Store"
          cd "${GITHUB_WORKSPACE}"

          IPA_FILE="$OUTPUT_DIR/${APP_NAME}_TrollStore.ipa"
          cp "$STAGING/${APP_NAME}_TrollStore.ipa" "$IPA_FILE"

          # 验证
          IPA_SIZE=$(stat -f%z "$IPA_FILE" 2>/dev/null || stat --format=%s "$IPA_FILE" 2>/dev/null || echo "0")
          echo "IPA file: $IPA_FILE"
          echo "IPA size: $IPA_SIZE bytes"

          if [ "$IPA_SIZE" -lt 15728640 ]; then
            echo "ERROR: IPA too small (${IPA_SIZE} bytes). Must be > 15MB."
            echo "=== .app structure ==="
            echo "App size: $(du -sh "$APP_PATH" 2>/dev/null | cut -f1)"
            ls -la "$APP_PATH/" | head -15
            exit 1
          fi

          echo "✅ IPA created successfully"
          echo "=== IPA contents ==="
          unzip -l "$IPA_FILE" | head -30
          ls -la "$OUTPUT_DIR/"

      # ========== 9. 上传 Artifacts ==========
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-IPA
          path: build/ipa_output/*.ipa
          retention-days: 90

      # ========== 10. 上传到 GitHub Releases（Tag 触发）==========
      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          files: build/ipa_output/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========== 11. 手动触发创建 Draft Release ==========
      - name: Create Draft Release for Manual Trigger
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Draft Build ${{ github.run_number }}
          tag_name: v0.0.${{ github.run_number }}
          files: build/ipa_output/*.ipa
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
