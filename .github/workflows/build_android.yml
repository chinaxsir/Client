name: Build APK for Android

# [修改备注：同理，将安卓打包的触发条件也改为了监听 main 分支的代码提交]
on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK version'
        required: false
        default: '3.29.0'

env:
  APP_NAME: XSOPForum

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 1. 设置 Java ==========
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # ========== 2. 设置 Flutter ==========
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: ${{ github.event.inputs.flutter_version || '3.29.0' }}
          cache: true

      - name: Verify Flutter
        run: flutter config --no-analytics && flutter doctor -v

      # ========== 3. 备份源码 ==========
      - name: Backup source code
        run: |
          mkdir -p assets
          tar cf src_backup.tar lib/ pubspec.yaml assets/

      # ========== 4. 生成平台文件并生成图标 ==========
      - name: Generate platforms and restore source
        run: |
          rm -rf ios/ android/
          flutter create . --platforms=android,ios --project-name=xsop_forum 2>&1
          
          rm -rf lib/ pubspec.yaml assets/
          tar xf src_backup.tar
          
          flutter pub get
          dart run flutter_launcher_icons

      # ========== 5. 编译 Android APK ==========
      - name: Build APK
        run: |
          flutter build apk --release --dart-define=BASE_URL=https://xsop.de

      # ========== 6. 动态重命名 APK ==========
      - name: Rename APK
        run: |
          OUTPUT_DIR="${GITHUB_WORKSPACE}/build/apk_output"
          mkdir -p "$OUTPUT_DIR"
          
          # [修改备注：统一使用流水号生成动态版本后缀]
          TAG_SUFFIX="v1.0.${{ github.run_number }}"
          FINAL_APK_NAME="Xsop${TAG_SUFFIX}.apk"
          
          APK_SOURCE_PATH="build/app/outputs/flutter-apk/app-release.apk"
          cp "$APK_SOURCE_PATH" "$OUTPUT_DIR/$FINAL_APK_NAME"

      # ========== 7. 自动创建 Releases 并上传 APK ==========
      # [修改备注：安卓侧同样自动创建 Release。它会使用与 iOS 侧完全相同的 Tag 名称，GitHub 会自动将 APK 追加到同一个 Release 页面下]
      - name: Auto Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Auto Release v1.0.${{ github.run_number }}
          body: "🚀 全新版本 v1.0.${{ github.run_number }} 已自动构建完成，支持直接下载安装包。"
          files: build/apk_output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
