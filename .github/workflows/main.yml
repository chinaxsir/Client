name: Build IPA for TrollStore

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK version'
        required: false
        default: '3.29.0'

env:
  APP_NAME: XSOPForum
  BUNDLE_ID: com.xsop.forum

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 1. 设置 Flutter ==========
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: ${{ github.event.inputs.flutter_version || '3.29.0' }}
          cache: true

      - name: Verify Flutter
        run: flutter config --no-analytics && flutter doctor -v

      # ========== 2. 生成 iOS 平台文件 ==========
      - name: Generate iOS platform
        run: |
          flutter create . --platforms=ios --project-name=xsop_forum
          flutter pub get

      # ========== 3. 安装 CocoaPods ==========
      - name: Install pods
        working-directory: ios
        run: |
          rm -rf Pods Podfile.lock
          pod install --repo-update 2>&1
          echo "=== Pod install done ==="
          ls -la Podfile.lock Pods 2>&1 || echo "WARNING: Podfile.lock or Pods missing"

      # ========== 4. 替换 Podfile 注入 TrollStore 配置 ==========
      # 用 Ruby 脚本修改已有的 post_install 块，而不是追加新的
      - name: Patch Podfile for TrollStore
        working-directory: ios
        run: |
          ruby <<'RUBY'
          path = "Podfile"
          content = File.read(path)

          # 在 flutter_additional_ios_build_settings(target) 之后注入 TrollStore 配置
          insertion = <<~INNER

            # ===== TrollStore 扩展：关闭代码签名 =====
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              config.build_settings['EXPANDED_CODE_SIGN_IDENTITY_PATH'] = ''
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              config.build_settings['DEVELOPMENT_TEAM'] = ''
              config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.xsop.forum'
            end
          INNER

          # 找到 flutter_additional_ios_build_settings(target) 这一行，在其后插入 TrollStore 配置
          # 使用 gsub 替换该行，保持原行 + 追加内容
          content.gsub!(
            /(flutter_additional_ios_build_settings\(target\))/,
            "\\1\n#{insertion.chomp}"
          )

          File.write(path, content)
          puts "Podfile patched with TrollStore settings."
          RUBY

          echo "Podfile patched."

      # 重新运行 pod install 使配置生效
      - name: Re-install pods with TrollStore config
        working-directory: ios
        run: |
          rm -rf Pods Podfile.lock
          pod install 2>&1
          echo "=== Pod re-install done ==="

      # ========== 5. 写入 Runner.entitlements ==========
      - name: Write Runner.entitlements
        run: |
          cat > ios/Runner/Runner.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.ubiquity-kvstore-access</key>
              <true/>
              <key>com.apple.developer.kernel.extended-virtual-address-space</key>
              <true/>
              <key>com.apple.security.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.developer.playable-content</key>
              <true/>
              <key>com.apple.developer.networking.wifi-info</key>
              <true/>
              <key>com.apple.developer.usb.host-device</key>
              <true/>
              <key>com.apple.developer.avfoundation.audio-fetch</key>
              <true/>
              <key>com.apple.security.files.user-selected.read-only</key>
              <true/>
              <key>com.apple.security.files.user-selected.read-write</key>
              <true/>
          </dict>
          </plist>
          PLIST

      # ========== 6. 写入 Info.plist ==========
      - name: Write Info.plist
        run: |
          cat > ios/Runner/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleDisplayName</key>
              <string>XSOP 论坛</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictorVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$(FLUTTER_BUILD_NAME)</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>$(FLUTTER_BUILD_NUMBER)</string>
              <key>IPHONEOS_DEPLOYMENT_TARGET</key>
              <string>15.0</string>
              <key>UIStatusBarStyle</key>
              <string>UIStatusBarStyleDefault</string>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>需要访问相册以上传头像</string>
              <key>NSCameraUsageDescription</key>
              <string>需要使用相机拍照上传</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>需要使用麦克风录制语音</string>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>需要获取位置信息</string>
              <key>NSLocationAlwaysUsageDescription</key>
              <string>需要后台持续获取位置</string>
              <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
              <string>需要持续获取位置信息</string>
              <key>NSBluetoothAlwaysUsageDescription</key>
              <string>需要蓝牙权限</string>
              <key>NSBluetoothPeripheralUsageDescription</key>
              <string>需要蓝牙外设权限</string>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
                  <string>fetch</string>
                  <string>remote-notification</string>
                  <string>processing</string>
                  <string>location</string>
              </array>
              <key>UIFileSharingEnabled</key>
              <false/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <false/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIRequiresFullScreen</key>
              <false/>
          </dict>
          </plist>
          PLIST

      # ========== 7. 修改 Xcode 工程 ==========
      - name: Configure Xcode Project
        run: |
          ruby <<'RUBY'
          path = "ios/Runner.xcodeproj/project.pbxproj"
          content = File.read(path)

          # 替换 Bundle ID
          content.gsub!(/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/, 'PRODUCT_BUNDLE_IDENTIFIER = com.xsop.forum;')

          # 禁用签名
          content.gsub!(/CODE_SIGNING_ALLOWED = YES;/, 'CODE_SIGNING_ALLOWED = NO;')
          content.gsub!(/CODE_SIGNING_REQUIRED = YES;/, 'CODE_SIGNING_REQUIRED = NO;')

          # 注入 Entitlements 引用
          unless content.include?('CODE_SIGN_ENTITLEMENTS')
            content.gsub!(/(\t\t\t\tCLANG_WARN_UNREACHABLE_CODE = YES;)/,
              "\\1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;")
          end

          File.write(path, content)
          puts "Project configured."
          RUBY

      # ========== 8. 使用 flutter build ipa 构建 ==========
      # flutter build ipa 会自动处理 xcodebuild 和打包
      # --no-codesign 跳过签名（TrollStore 自行签名）
      - name: Build IPA with Flutter
        run: |
          flutter build ipa \
            --no-codesign \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=BASE_URL=https://xsop.de 2>&1 | tee /tmp/flutter_build.log

          if [ $? -ne 0 ]; then
            echo "=== flutter build ipa failed ==="
            tail -80 /tmp/flutter_build.log
            echo ""
            echo "=== Falling back to manual xcodebuild ==="
            cd ios
            xcodebuild \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ENABLE_BITCODE=NO \
              PROVISIONING_PROFILE_SPECIFIER="" \
              DEVELOPMENT_TEAM="" \
              CODE_SIGN_STYLE=Automatic \
              build 2>&1 | tee /tmp/xcodebuild.log

            if [ $? -ne 0 ]; then
              echo "=== xcodebuild also failed ==="
              tail -80 /tmp/xcodebuild.log
              exit 1
            fi

            # 找到 .app 并手动打包
            APP_PATH=$(find build -name "*.app" | head -1)
            if [ -z "$APP_PATH" ]; then
              echo "ERROR: .app not found"
              exit 1
            fi

            IPA_OUT="${GITHUB_WORKSPACE}/build/ipa_output"
            mkdir -p "$IPA_OUT/Payload"
            cp -r "$APP_PATH" "$IPA_OUT/Payload/"
            cd "$IPA_OUT"
            zip -r "${APP_NAME}_TrollStore.ipa" Payload/
            cd "${GITHUB_WORKSPACE}"
          fi

      # ========== 9. 调试：打印所有构建产物 ==========
      - name: Debug - List all build artifacts
        run: |
          echo "=== Searching for IPA files ==="
          find . -name "*.ipa" 2>/dev/null || echo "No IPA found"

          echo ""
          echo "=== Searching for .app files ==="
          find . -name "*.app" -type d 2>/dev/null || echo "No .app found"

          echo ""
          echo "=== Contents of build/ios/ ==="
          ls -laR build/ios/ 2>/dev/null || echo "build/ios/ not found"

          echo ""
          echo "=== Contents of ios/build/ ==="
          ls -laR ios/build/ 2>/dev/null || echo "ios/build/ not found"

      # ========== 10. 确保 IPA 在正确位置 ==========
      - name: Locate and package IPA
        run: |
          # flutter build ipa 默认输出到 build/ios/ipa/
          IPA_OUT="${GITHUB_WORKSPACE}/build/ipa_output"
          mkdir -p "$IPA_OUT"

          # 1. 尝试从 flutter build ipa 输出复制
          if ls build/ios/ipa/*.ipa 1>/dev/null 2>&1; then
            echo "Copying IPA from flutter build..."
            cp build/ios/ipa/*.ipa "$IPA_OUT/"
          # 2. 尝试从 xcodebuild 输出打包
          elif APP_PATH=$(find ios/build -name "*.app" -type d 2>/dev/null | head -1); [ -n "$APP_PATH" ]; then
            echo "Packaging IPA from .app: $APP_PATH"
            mkdir -p "$IPA_OUT/Payload"
            cp -r "$APP_PATH" "$IPA_OUT/Payload/"
            cd "$IPA_OUT"
            zip -r "${APP_NAME}_TrollStore.ipa" Payload/
            cd "${GITHUB_WORKSPACE}"
          # 3. 尝试从 build/ 下查找
          elif APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1); [ -n "$APP_PATH" ]; then
            echo "Packaging IPA from build/ .app: $APP_PATH"
            mkdir -p "$IPA_OUT/Payload"
            cp -r "$APP_PATH" "$IPA_OUT/Payload/"
            cd "$IPA_OUT"
            zip -r "${APP_NAME}_TrollStore.ipa" Payload/
            cd "${GITHUB_WORKSPACE}"
          else
            echo "ERROR: No IPA or .app found, cannot package"
            exit 1
          fi

          echo ""
          echo "=== Final IPA files ==="
          ls -la "$IPA_OUT/" 2>/dev/null || echo "No IPA found!"

      # ========== 11. 上传到 Artifacts ==========
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-IPA
          path: build/ipa_output/*.ipa
          retention-days: 90

      # ========== 12. 上传到 GitHub Releases ==========
      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          files: build/ipa_output/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========== 13. 为手动触发创建 Release ==========
      - name: Create Draft Release for Manual Trigger
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Draft Build ${{ github.run_number }}
          tag_name: v0.0.${{ github.run_number }}
          files: build/ipa_output/*.ipa
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========== 11. 清理 ==========
      - name: Cleanup
        if: always()
        run: rm -rf ios/Pods ios/Podfile.lock ios/build
