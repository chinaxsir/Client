name: Build IPA for Iphone

# [修改备注：将触发条件从 tags 改为了监听 main 分支的代码推送。以后只要 main 分支代码有任何变动，就会自动触发打包]
on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK version'
        required: false
        default: '3.29.0'

env:
  APP_NAME: XSOPForum
  BUNDLE_ID: com.xsop.forum

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 1. 设置 Flutter ==========
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: ${{ github.event.inputs.flutter_version || '3.29.0' }}
          cache: true

      - name: Verify Flutter
        run: flutter config --no-analytics && flutter doctor -v

      # ========== 2. 备份源码 ==========
      - name: Backup source code
        run: |
          mkdir -p assets
          tar cf src_backup.tar lib/ pubspec.yaml assets/
          echo "Source backed up"
          ls -la lib/

      # ========== 3. 生成平台文件并恢复源码 ==========
      - name: Generate iOS and restore source
        run: |
          rm -rf ios/ android/
          flutter create . --platforms=ios,android --project-name=xsop_forum 2>&1

          rm -rf lib/ pubspec.yaml assets/
          tar xf src_backup.tar

          if grep -q "XSOPForumApp" lib/main.dart; then
            echo "✅ main.dart verified"
          else
            echo "❌ main.dart was overwritten!"
            exit 1
          fi

          flutter pub get
          dart run flutter_launcher_icons

      # ========== 4. 安装 CocoaPods ==========
      - name: Install pods
        working-directory: ios
        run: |
          if [ -f "Podfile" ]; then
            rm -rf Pods Podfile.lock
            pod install 2>&1 | tail -30
          else
            echo "✅ No Podfile found, skipping CocoaPods installation."
          fi

      # ========== 5. 写入 Info.plist ==========
      - name: Write Info.plist
        run: |
          cat > ios/Runner/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleDisplayName</key>
              <string>XSOP</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$(FLUTTER_BUILD_NAME)</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>$(FLUTTER_BUILD_NUMBER)</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon</string>
                      </array>
                  </dict>
              </dict>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIMainStoryboardFile</key>
              <string>Main</string>
              <key>CADisableMinimumFrameDurationOnPhone</key>
              <true/>
              <key>UIApplicationSupportsIndirectInputEvents</key>
              <true/>
              <key>IPHONEOS_DEPLOYMENT_TARGET</key>
              <string>15.0</string>
              <key>UIStatusBarStyle</key>
              <string>UIStatusBarStyleDefault</string>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST

      # ========== 6. 修改构建配置：强制免签 ==========
      - name: Configure Xcode project
        run: |
          PROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = com.xsop.forum;/g' "$PROJ"
          XCCONFIG="ios/Flutter/Release.xcconfig"
          echo "DEVELOPMENT_TEAM = ABCDE12345" >> "$XCCONFIG"
          echo "CODE_SIGNING_ALLOWED = NO" >> "$XCCONFIG"
          echo "CODE_SIGNING_REQUIRED = NO" >> "$XCCONFIG"
          echo "CODE_SIGN_IDENTITY = -" >> "$XCCONFIG"
          echo "EXPANDED_CODE_SIGN_IDENTITY = -" >> "$XCCONFIG"
          echo "PROVISIONING_PROFILE_SPECIFIER = \"\"" >> "$XCCONFIG"

      # ========== 7. 编译 iOS ==========
      - name: Build .app with Flutter
        run: |
          DERIVED="${GITHUB_WORKSPACE}/build/DerivedData"
          cd ios
          rm -rf build/ "$DERIVED"
          flutter build ios --no-codesign --dart-define=BASE_URL=https://xsop.de 2>&1 | tee /tmp/flutter_build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "  flutter build ios FAILED"
            exit 1
          fi

      # ========== 8. 打包 IPA + 动态命名 ==========
      - name: Package IPA with Entitlements
        run: |
          OUTPUT_DIR="${GITHUB_WORKSPACE}/build/ipa_output"
          DERIVED="${GITHUB_WORKSPACE}/build/DerivedData"
          
          APP_PATH=$(find "$DERIVED" build ios/build -name "*.app" -not -path "*/.symlinks/*" -type d 2>/dev/null | head -1)
          
          cat > ios/Runner/Runner.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.ubiquity-kvstore-access</key>
              <true/>
              <key>com.apple.developer.kernel.extended-virtual-address-space</key>
              <true/>
              <key>com.apple.security.allow-unsigned-executable-memory</key>
              <true/>
          </dict>
          </plist>
          PLIST

          brew install ldid
          APP_NAME=$(basename "$APP_PATH" .app)
          ldid -Sios/Runner/Runner.entitlements "$APP_PATH/"
          
          # [修改备注：不论是怎么触发的，强制使用 v1.0. 加上 GitHub Actions 的流水号自动生成版本号，例如 v1.0.45]
          TAG_SUFFIX="v1.0.${{ github.run_number }}"
          FINAL_IPA_NAME="Xsop${TAG_SUFFIX}.ipa"

          mkdir -p "$OUTPUT_DIR"
          STAGING="${GITHUB_WORKSPACE}/build/staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -r "$APP_PATH" "$STAGING/Payload/"

          cd "$STAGING"
          zip -r "$FINAL_IPA_NAME" Payload/ -x "*.DS_Store"
          cd "${GITHUB_WORKSPACE}"

          IPA_FILE="$OUTPUT_DIR/$FINAL_IPA_NAME"
          cp "$STAGING/$FINAL_IPA_NAME" "$IPA_FILE"

      # ========== 9. 自动创建 Releases 并上传 IPA ==========
      # [修改备注：去除了之前判断 Tag 的条件，现在每次构建都会使用自动生成的版本号强制发布一个 Release]
      - name: Auto Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Auto Release v1.0.${{ github.run_number }}
          body: "🚀 全新版本 v1.0.${{ github.run_number }} 已自动构建完成，支持直接下载安装包。"
          files: build/ipa_output/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
