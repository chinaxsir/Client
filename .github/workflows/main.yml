name: Build IPA for TrollStore

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK version'
        required: false
        default: '3.29.0'

env:
  APP_NAME: XSOPForum
  BUNDLE_ID: com.xsop.forum

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 0. 设置 Flutter SDK ==========
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: ${{ github.event.inputs.flutter_version || '3.29.0' }}
          cache: true

      - name: Verify Flutter
        run: flutter config --no-analytics && flutter doctor -v

      # ========== 1. 生成完整 iOS 工程 ==========
      # 关键：始终执行 flutter create，它不会覆盖已存在的自定义文件
      # 但会生成 .xcodeproj、.xcworkspace、Flutter/ 等必需文件
      - name: Generate iOS platform
        run: |
          flutter create . --platforms=ios
          flutter pub get

      # ========== 2. 安装 CocoaPods 依赖 ==========
      - name: Install pods
        working-directory: ios
        run: |
          rm -rf Pods Podfile.lock
          pod install --repo-update

      # ========== 3. 写入 Runner.entitlements ==========
      - name: Write Runner.entitlements
        run: |
          cat > ios/Runner/Runner.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.ubiquity-kvstore-access</key>
              <true/>
              <key>com.apple.developer.kernel.extended-virtual-address-space</key>
              <true/>
              <key>com.apple.security.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.developer.playable-content</key>
              <true/>
              <key>com.apple.developer.networking.wifi-info</key>
              <true/>
              <key>com.apple.developer.usb.host-device</key>
              <true/>
              <key>com.apple.developer.avfoundation.audio-fetch</key>
              <true/>
              <key>com.apple.security.files.user-selected.read-only</key>
              <true/>
              <key>com.apple.security.files.user-selected.read-write</key>
              <true/>
          </dict>
          </plist>
          PLIST

      # ========== 4. 写入 Info.plist ==========
      # 用 cat 直接覆盖（比 PlistBuddy 可靠得多）
      - name: Write Info.plist
        run: |
          cat > ios/Runner/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleDisplayName</key>
              <string>XSOP 论坛</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictorVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$(FLUTTER_BUILD_NAME)</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>$(FLUTTER_BUILD_NUMBER)</string>
              <key>IPHONEOS_DEPLOYMENT_TARGET</key>
              <string>15.0</string>
              <key>UIStatusBarStyle</key>
              <string>UIStatusBarStyleDefault</string>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>需要访问相册以上传头像</string>
              <key>NSCameraUsageDescription</key>
              <string>需要使用相机拍照上传</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>需要使用麦克风录制语音</string>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>需要获取位置信息</string>
              <key>NSLocationAlwaysUsageDescription</key>
              <string>需要后台持续获取位置</string>
              <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
              <string>需要持续获取位置信息</string>
              <key>NSBluetoothAlwaysUsageDescription</key>
              <string>需要蓝牙权限</string>
              <key>NSBluetoothPeripheralUsageDescription</key>
              <string>需要蓝牙外设权限</string>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
                  <string>fetch</string>
                  <string>remote-notification</string>
                  <string>processing</string>
                  <string>location</string>
              </array>
              <key>UIFileSharingEnabled</key>
              <false/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <false/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIRequiresFullScreen</key>
              <false/>
          </dict>
          </plist>
          PLIST

      # ========== 5. 修改 Xcode 工程 ==========
      - name: Configure Xcode Project
        run: |
          ruby <<'RUBY'
          path = "ios/Runner.xcodeproj/project.pbxproj"
          content = File.read(path)

          # 替换 Bundle ID
          content.gsub!(/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/, 'PRODUCT_BUNDLE_IDENTIFIER = com.xsop.forum;')

          # 禁用签名
          content.gsub!(/CODE_SIGNING_ALLOWED = YES;/, 'CODE_SIGNING_ALLOWED = NO;')
          content.gsub!(/CODE_SIGNING_REQUIRED = YES;/, 'CODE_SIGNING_REQUIRED = NO;')

          # 注入 Entitlements 引用
          unless content.include?('CODE_SIGN_ENTITLEMENTS')
            content.gsub!(/(\t\t\t\tCLANG_WARN_UNREACHABLE_CODE = YES;)/,
              "\\1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;")
          end

          File.write(path, content)
          puts "Project configured."
          RUBY

      # ========== 6. 构建 .app ==========
      - name: Build .app
        run: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Automatic \
            build 2>&1 | tee /tmp/xcodebuild.log

          if [ $? -ne 0 ]; then
            echo "=== xcodebuild failed ==="
            tail -80 /tmp/xcodebuild.log
            exit 1
          fi

          APP_PATH=$(find build -name "*.app" -path "*/Release-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found: $APP_PATH"

      # ========== 7. 打包 IPA ==========
      - name: Package IPA
        run: |
          APP_PATH="${APP_PATH:-$(find ios/build -name '*.app' | head -1)}"
          IPA_OUT="${GITHUB_WORKSPACE}/build/ipa_output"
          mkdir -p "$IPA_OUT/Payload"
          cp -r "$APP_PATH" "$IPA_OUT/Payload/"
          cd "$IPA_OUT"
          zip -r "${APP_NAME}_TrollStore.ipa" Payload/
          cd "${GITHUB_WORKSPACE}"
          ls -la "${IPA_OUT}/${APP_NAME}_TrollStore.ipa"

      # ========== 8. 上传产物 ==========
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-IPA
          path: build/ipa_output/*.ipa
          retention-days: 90

      # ========== 9. 清理 ==========
      - name: Cleanup
        if: always()
        run: rm -rf ios/Pods ios/Podfile.lock ios/build
