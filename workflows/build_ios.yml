name: Build IPA for TrollStore

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK version'
        required: false
        default: '3.29.0'

env:
  APP_NAME: XSOPForum
  BUNDLE_ID: com.xsop.forum

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: bluefireteam/setup-flutter@v3
        with:
          channel: stable
          version: ${{ github.event.inputs.flutter_version || '3.29.0' }}
          cache: true

      - name: Verify Flutter
        run: flutter config --no-analytics && flutter doctor -v

      - name: Create iOS platform
        run: flutter create . --platforms=ios

      - name: Install pods
        working-directory: ios
        run: pod install

      # ---- TrollStore 扩展权限 ----
      - name: Inject Extended Entitlements
        run: |
          cat > ios/Runner/Runner.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.ubiquity-kvstore-access</key>
              <true/>
              <key>com.apple.developer.kernel.extended-virtual-address-space</key>
              <true/>
              <key>com.apple.security.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.developer.playable-content</key>
              <true/>
              <key>com.apple.developer.networking.wifi-info</key>
              <true/>
              <key>com.apple.developer.coremedia.hls.lowerlatency</key>
              <true/>
              <key>com.apple.developer.usb.host-device</key>
              <true/>
              <key>com.apple.developer.avfoundation.audio-fetch</key>
              <true/>
              <key>com.apple.developer.coremedia.hls.low-latency</key>
              <true/>
          </dict>
          </plist>
          PLIST

      # ---- 修改 Info.plist 开启后台模式 ----
      - name: Enable Background Modes
        run: |
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string fetch" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:2 string remote-notification" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:3 string processing" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:4 string location" ios/Runner/Info.plist || true

          # 设置用途说明字符串（TrollStore 运行不需要上架，但为完整性保留）
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string '需要访问相册以上传头像'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string '需要使用相机拍照上传'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '需要使用麦克风录制语音'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string '需要获取位置信息'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysUsageDescription string '需要后台持续获取位置'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string '需要持续获取位置信息'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist

      # ---- 修改工程配置：不签名 + 注入 Entitlements ----
      - name: Configure Xcode for TrollStore (no-sign + entitlements)
        run: |
          # 1. 关闭代码签名（TrollStore 自行签名）
          /usr/libexec/PlistBuddy -c "Delete :CODE_SIGNING_ALLOWED" ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true

          # 2. 修改 Runner target Build Settings
          # 禁用所有签名
          for config in Debug Release Profile; do
            sed -i '' "/PRODUCT_BUNDLE_IDENTIFIER = com.example.example;/s/com.example.example/${{ env.BUNDLE_ID }}/" ios/Runner.xcodeproj/project.pbxproj
          done

      # ---- 构建 IPA（不签名，TrollStore 友好）----
      - name: Build IPA (No-Codesign)
        run: |
          # 使用 flutter build ipa 并跳过签名
          flutter build ipa \
            --no-codesign \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=BASE_URL=https://xsop.de

          # 如果 flutter build ipa 失败（需要开发者账号配置），回退到手工构建 .app
          if [ ! -f build/ios/ipa/${{ env.APP_NAME }}.ipa ]; then
            echo "flutter build ipa failed, falling back to manual build..."

            # 使用 xcodebuild 直接构建 .app（不签名）
            cd ios
            xcodebuild \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -destination generic/platform=iOS \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ENABLE_BITCODE=NO \
              PROVISIONING_PROFILE_SPECIFIER="" \
              build

            # 找到生成的 .app
            APP_PATH=$(find build -name "*.app" -path "*/Release-iphoneos/*" | head -1)
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find build -name "*.app" | head -1)
            fi

            if [ -z "$APP_PATH" ]; then
              echo "ERROR: .app not found"
              exit 1
            fi

            echo "Found .app at: $APP_PATH"

            # 打包为 .ipa（TrollStore 格式，无需签名）
            IPA_DIR="${GITHUB_WORKSPACE}/build/ipa_output"
            mkdir -p "$IPA_DIR/Payload"
            cp -r "$APP_PATH" "$IPA_DIR/Payload/"
            cd "$IPA_DIR"
            zip -r "${{ env.APP_NAME }}_TrollStore.ipa" Payload/
            cd "${GITHUB_WORKSPACE}"
          fi

      # ---- 上传产物 ----
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-IPA
          path: |
            build/ios/ipa/*.ipa
            build/ipa_output/*.ipa
          retention-days: 90

      # ---- 附加：产出 .app.zip（部分 TrollStore 工具支持直接安装 .app 包）----
      - name: Package .app as .app.zip
        run: |
          APP_DIR="${GITHUB_WORKSPACE}/build/app_output"
          mkdir -p "$APP_DIR"

          # 尝试从 ipa 解压或从 xcodebuild 产物获取 .app
          IPA_FILE=$(find build -name "*.ipa" | head -1)
          if [ -n "$IPA_FILE" ]; then
            cd "$APP_DIR"
            unzip -o "$IPA_FILE"
            cd "${GITHUB_WORKSPACE}"
          fi

          # 查找 .app 并打包
          APP_PATH=$(find build -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$APP_DIR" -name "*.app" | head -1)
          fi

          if [ -n "$APP_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH")
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$APP_DIR/${APP_NAME}.zip"
            echo "Created .app.zip at $APP_DIR/${APP_NAME}.zip"
          fi

          ls -la "$APP_DIR/"

      - name: Upload .app.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-App
          path: build/app_output/*.zip
          retention-days: 90
