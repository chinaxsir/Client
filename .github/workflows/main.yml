name: Build IPA for TrollStore

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      node_version: # [修改位置]：原为 flutter_version，已修改为 node_version
        description: 'Node.js version'
        required: false
        default: '20'

env:
  APP_NAME: XSOPForum
  BUNDLE_ID: com.xsop.forum

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 1. 设置构建环境 ==========
      # [修改位置]：原先的 Flutter setup 替换为 Node.js
      # [修改备注]：匹配 XSOP-Forum 的 React Native 和 Expo 技术栈
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ github.event.inputs.node_version || '20' }}
          cache: 'npm'

      # ========== 2. 生成 iOS 平台文件 ==========
      # [修改位置]：原先的 flutter create 替换为 expo prebuild
      # [修改备注]：执行 prebuild 动态生成完整的 iOS 原生工程以供后续编译
      - name: Install dependencies & Prebuild
        run: |
          npm install
          npx expo prebuild --platform ios --clean

      # ========== 3. 安装 CocoaPods ==========
      # [修改位置]：保持不变，但在 prebuild 生成 ios 目录后执行
      - name: Install pods
        working-directory: ios
        run: |
          pod install 2>&1
          echo "=== Pod install done ==="

      # ========== 4. 写入 TrollStore 权限 ==========
      # [修改位置]：替换了原先的 cat 硬覆盖 Runner.entitlements 的方式
      # [修改备注]：改为动态查找 entitlements 文件并使用 PlistBuddy 追加巨魔核心权限，避免破坏 Expo 原有配置结构
      - name: Write Entitlements
        run: |
          ENTITLEMENTS_PATH=$(find ios -name "*.entitlements" | head -n 1)
          if [ -n "$ENTITLEMENTS_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.ubiquity-kvstore-access bool true" "$ENTITLEMENTS_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.extended-virtual-address-space bool true" "$ENTITLEMENTS_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.allow-unsigned-executable-memory bool true" "$ENTITLEMENTS_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.playable-content bool true" "$ENTITLEMENTS_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.files.user-selected.read-only bool true" "$ENTITLEMENTS_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.files.user-selected.read-write bool true" "$ENTITLEMENTS_PATH" || true
            echo "Entitlements injected to $ENTITLEMENTS_PATH"
          fi

      # ========== 5. 修改 Bundle ID ==========
      # [修改位置]：更新了 sed 的查找路径
      # [修改备注]：动态匹配生成的 project.pbxproj 以修改 Bundle ID
      - name: Set Bundle ID
        run: |
          PBXPROJ_PATH=$(find ios -name "project.pbxproj" | head -n 1)
          if [ -n "$PBXPROJ_PATH" ]; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^\;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }};/g" "$PBXPROJ_PATH"
            echo "Bundle ID set to ${{ env.BUNDLE_ID }}"
          fi

      # ========== 6. 使用 xcodebuild 构建 ==========
      # [修改位置]：原 flutter build ipa 替换为原生 xcodebuild
      # [修改备注]：完全禁用代码签名验证，并将产物输出到指定的 derivedDataPath 目录，方便下一步精确提取 .app
      - name: Build App (No Codesign)
        working-directory: ios
        run: |
          WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | xcpretty || true

      # ========== 7. 打包为 TrollStore IPA ==========
      # [修改位置]：重写了打包和复制的逻辑
      # [修改备注]：这是巨魔无签名打包最容易踩坑的地方，此步骤主动创建 Payload 文件夹装载无签名 .app，然后压缩生成能被巨魔识别的 .ipa 最终文件
      - name: Package to IPA
        run: |
          IPA_OUT="${GITHUB_WORKSPACE}/build/ipa_output"
          mkdir -p "$IPA_OUT/Payload"
          
          # 查找 xcodebuild 生成的 .app 文件夹
          APP_PATH=$(find ios/build_output/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" "$IPA_OUT/Payload/"
            cd "$IPA_OUT"
            zip -r "${{ env.APP_NAME }}.ipa" Payload
            rm -rf Payload
            echo "=== IPA Packaged SUCCESS ==="
            ls -la
          else
            echo "ERROR: No .app found in build output!"
            exit 1
          fi

      # ========== 8. 上传到 Artifacts ==========
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-IPA
          path: build/ipa_output/*.ipa
          retention-days: 90

      # ========== 9. 上传到 GitHub Releases ==========
      # [修改位置]：增加了 body 字段
      # [修改备注]：注入商业与专业介绍，声明我们不提供算法推荐服务
      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          files: build/ipa_output/*.ipa
          draft: false
          prerelease: false
          body: |
            ## XSOP-Forum TrollStore 更新发布
            
            **专业与商业介绍：**
            我们致力于提供稳定、高效的平台系统，注重内容的呈现与社群交流体验。请注意，本平台不提供任何算法服务。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========== 10. 为手动触发创建 Draft Release ==========
      # [修改位置]：增加了 body 字段
      # [修改备注]：保持介绍说明在各个发布渠道上的统一
      - name: Create Draft Release for Manual Trigger
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Draft Build ${{ github.run_number }}
          tag_name: v0.0.${{ github.run_number }}
          files: build/ipa_output/*.ipa
          draft: true
          prerelease: true
          body: |
            ## XSOP-Forum TrollStore 草稿构建 (Draft)
            
            **专业与商业介绍：**
            我们致力于提供稳定、高效的平台系统，注重内容的呈现与社群交流体验。请注意，本平台不提供任何算法服务。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
